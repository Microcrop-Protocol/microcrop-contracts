[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
via_ir = true
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base_mainnet = "${BASE_MAINNET_RPC_URL}"

[etherscan]
# Etherscan API V2 (unified multichain endpoint). The old per-chain Basescan V1
# URLs (api.basescan.org / api-sepolia.basescan.org) are deprecated and now
# reject verification with "deprecated V1 endpoint". V2 routes by chain id.
base_mainnet = { key = "${BASESCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 8453 }
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 84532 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
